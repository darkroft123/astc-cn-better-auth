name: Build ARM64 image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/joyit-yprogram/astc-cn-better-auth

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          file: dockerfile
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Export image for offline load
        run: |
          docker pull ${{ env.IMAGE }}:${{ github.sha }}
          docker save ${{ env.IMAGE }}:${{ github.sha }} | gzip > better-auth-arm64.tar.gz

      - name: Upload ARM64 image artifact
        uses: actions/upload-artifact@v4
        with:
          name: better-auth-arm64
          path: better-auth-arm64.tar.gz
          retention-days: 7